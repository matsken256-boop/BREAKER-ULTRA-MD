<!DOCTYPE html>
<html>
<head>
<title>BREAKER ULTRA MD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#000;color:#0f0;font-family:monospace;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.box{border:2px solid #0f0;padding:30px;border-radius:15px;text-align:center;max-width:400px;width:90%}
input{padding:12px;width:90%;border:2px solid #0f0;background:#000;color:#0f0;text-align:center;font-size:16px;margin:10px 0}
button{padding:12px 30px;background:#0f0;color:#000;border:none;font-weight:bold;cursor:pointer;font-size:16px;margin-top:10px}
#code{font-size:28px;margin-top:20px;word-break:break-all;letter-spacing:4px;color:#fff}
#info{margin-top:10px;font-size:14px}
</style>
</head>
<body>
<div class="box">
<h2>BREAKER ULTRA MD</h2>
<p>Enter WhatsApp number with country code</p>
<input id="num" placeholder="256766800757">
<br>
<button onclick="getCode()">GET PAIR CODE</button>
<div id="code"></div>
<p id="info"></p>
</div>
<script>
async function getCode(){
 let n=document.getElementById('num').value.trim();
 if(!n){alert('Enter number');return;}
 let box=document.getElementById('code');
 let info=document.getElementById('info');
 box.innerHTML='Loading... Please wait 10 sec';
 info.innerHTML='';
 try{
  let r=await fetch('/pair?number='+n);
  let d=await r.json();
  if(d.code){
    box.innerHTML=d.code;
    info.innerHTML='Copy this code: Open WhatsApp > Linked Devices > Link a Device > Link with phone number';
  } else {
    box.innerHTML=d.error || 'Failed';
    info.innerHTML='';
  }
 }catch(e){box.innerHTML='Error: '+e.message;}
}
</script>
</body>
</html>
