<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pair</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.box{border:1px solid #222;padding:30px;border-radius:12px;width:90%;max-width:360px;text-align:center}
input{width:100%;padding:12px;background:#111;border:1px solid #222;color:#fff;border-radius:8px;margin:15px 0}
button{width:100%;padding:12px;background:#fff;color:#000;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
#code{margin-top:20px;font-size:24px;letter-spacing:4px;display:none}
</style>
</head>
<body>
<div class="box">
<h3>PAIR DEVICE</h3>
<input id="num" placeholder="2557XXXXXXXX (no +)">
<button onclick="getCode()">Get Code</button>
<div id="code"></div>
<div id="msg" style="margin-top:15px;color:#888;font-size:13px"></div>
</div>
<script>
async function getCode(){
  const n=document.getElementById('num').value;
  const c=document.getElementById('code'); const m=document.getElementById('msg');
  if(!n) return m.innerText="Enter number";
  m.innerText="Generating..."; c.style.display="none";
  const r=await fetch(`/code?number=${n}`); const d=await r.json();
  if(d.code){ c.innerText=d.code; c.style.display="block"; m.innerText="Enter this code in WhatsApp > Linked Devices"; }
  else m.innerText=d.error||"Failed";
}
</script>
</body>
</html>
