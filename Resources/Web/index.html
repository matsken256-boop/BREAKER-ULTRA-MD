<script>

  s.innerHTML=`┌─⊷ ◇ PAIRING ◇<br>│ Number: ${num}<br>│ Status: Connecting...<br>└─⊷`;

  fetch(`/pair?number=${num}`).then(r=>r.json()).then(d=>{
    s.innerHTML=`┌─⊷ ◇ CODE ◇<br>│ Code: ${d.code || 'Check WhatsApp'}<br>└─⊷`;
  }).catch(()=>{
    s.innerHTML=`┌─⊷ ◇ ERROR ◇<br>│ Pair server offline<br>│ Use /Resources/Socket<br>└─⊷`;
  });
}
