<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>BREAKER-ULTRA-MD</title><style>body{background:#000;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif}.box{background:#111;padding:20px;border-radius:12px;width:90%;max-width:350px;text-align:center;border:1px solid #222}input,button{width:95%;padding:12px;margin:8px 0;border-radius:8px;border:none}button{background:#00ff88;font-weight:bold}code{color:#00ff88;font-size:22px;letter-spacing:3px}</style></head><body><div class="box"><h2>⚡ BREAKER-ULTRA-MD</h2><input id="pass" type="password" placeholder="MASTER_PASSWORD"><input id="num" placeholder="256769724124"><button onclick="getCode()">Get Code</button><h3 id="code"></h3><p id="msg"></p><script>async function getCode(){let n=document.getElementById('num').value.replace(/[^0-9]/g,'');let p=document.getElementById('pass').value;msg.innerText='Loading...';let r=await fetch('/pair?number='+n+'&password='+p);let d=await r.json();if(d.code){code.innerText=d.code;msg.innerText='Linked Devices > Link with number'}else msg.innerText=d.error}</script></div></body></html>
