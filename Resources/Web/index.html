<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BREAKER ULTRA-MD v2.7.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0a0a14;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{width:100%;max-width:380px;background:#151528;border-radius:20px;overflow:hidden;border:1px solid #2a2a4a;box-shadow:0 0 40px rgba(124,77,255,0.2)}
.header{text-align:center;padding:30px 20px 20px}
.logo{width:70px;height:70px;background:linear-gradient(135deg,#7c4dff,#00e5ff);border-radius:50%;display:flex;justify-content:center;align-items:center;margin:0 auto 15px;font-size:35px}
h1{font-size:22px;background:linear-gradient(90deg,#7c4dff,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
.sub{font-size:12px;color:#888;margin-top:5px}
.tabs{display:flex;background:#0f0f22}
.tab{flex:1;padding:15px;text-align:center;cursor:pointer;font-weight:600;color:#666;transition:0.3s;border-bottom:2px solid transparent}
.tab.active{color:#7c4dff;border-bottom:2px solid #7c4dff;background:#151528}
.content{padding:20px}
.label{font-size:11px;color:#aaa;margin:15px 0 6px;display:block;letter-spacing:1px}
input{width:100%;padding:14px;background:#0f0f22;border:1px solid #2a2a4a;border-radius:12px;color:#fff;outline:none;font-size:15px}
input:focus{border-color:#7c4dff}
.btn{width:100%;padding:14px;margin-top:20px;background:linear-gradient(90deg,#7c4dff,#6a3de8);border:none;border-radius:12px;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.btn:active{transform:scale(0.98)}
#codeBox{display:none;margin-top:20px;background:#0f0f22;border:1px dashed #7c4dff;padding:15px;border-radius:12px;text-align:center}
.code{font-size:26px;letter-spacing:4px;font-weight:800;color:#00e5ff;margin:10px 0}
.small{font-size:11px;color:#888}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo">⚡</div>
    <h1>BREAKER ULTRA-MD</h1>
    <div class="sub">v2.7.0 BOX LOCKED • PRO Pair Panel</div>
  </div>
  <div class="tabs">
    <div class="tab" id="tab-login" onclick="switchTab('login')">Login</div>
    <div class="tab active" id="tab-pair" onclick="switchTab('pair')">Pair New</div>
  </div>
  <div class="content">
    <!-- PAIR TAB -->
    <div id="pair-sec">
      <label class="label">PHONE NUMBER</label>
      <input id="phone" placeholder="2567..." value="256790086834">
      <button class="btn" onclick="getCode()">GET PAIR CODE</button>
      <div id="codeBox">
        <div class="small">YOUR PAIR CODE</div>
        <div class="code" id="pairCode">---- ----</div>
        <div class="small">WhatsApp > Linked Devices > Link with phone number</div>
        <div class="small" style="margin-top:8px;color:#7c4dff" id="timer"></div>
      </div>
    </div>
    <!-- LOGIN TAB -->
    <div id="login-sec" style="display:none">
      <label class="label">PHONE NUMBER</label>
      <input id="phone2" placeholder="2567...">
      <label class="label">ACCESS CODE</label>
      <input id="access" placeholder="Enter code (Master: Breaker)">
      <button class="btn" onclick="verifyLogin()">Verify & Login</button>
      <div class="small" style="text-align:center;margin-top:12px">Master Password: <b style="color:#fff">Breaker</b></div>
    </div>
  </div>
</div>
<script>
function switchTab(t){
  document.getElementById('tab-login').classList.toggle('active', t==='login');
  document.getElementById('tab-pair').classList.toggle('active', t==='pair');
  document.getElementById('pair-sec').style.display = t==='pair' ? 'block' : 'none';
  document.getElementById('login-sec').style.display = t==='login' ? 'block' : 'none';
}
async function getCode(){
  const num = document.getElementById('phone').value.trim();
  if(!num) return alert('Enter number');
  document.getElementById('codeBox').style.display='block';
  document.getElementById('pairCode').innerText='Loading...';
  const endpoints = [`/code?number=${num}`, `/pair?number=${num}`, `/api/pair?number=${num}`, `/requestPairCode?number=${num}`];
  for(let url of endpoints){
    try{
      const res = await fetch(url);
      const data = await res.json().catch(()=>res.text());
      const code = data.code || data.pairCode || data.pair_code || data;
      if(code && String(code).length>=4){
        document.getElementById('pairCode').innerText=code.code||code;
        startTimer();
        return;
      }
    }catch(e){}
  }
  document.getElementById('pairCode').innerText='Check Console Logs';
}
function startTimer(){
  let s=300;
  const el=document.getElementById('timer');
  setInterval(()=>{s--; el.innerText=`Expires in ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; if(s<=0) el.innerText='Expired - Get New Code';},1000);
}
async function verifyLogin(){
  const number=document.getElementById('phone2').value||document.getElementById('phone').value;
  const code=document.getElementById('access').value;
  if(code==='Breaker' || code==='BREAKER' || code.length>=4){
    alert('Access Granted! Now go to Pair New to get code');
    switchTab('pair');
  } else {
    alert('Invalid Access Code! Use Master: Breaker');
  }
}
// default pair tab active
switchTab('pair');
</script>
</body>
</html>
