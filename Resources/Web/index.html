<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BREAKER ULTRA-MD - Pair</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a14;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{width:100%;max-width:380px;background:#151528;border:1px solid rgba(255,255,255,0.06);border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.header{text-align:center;padding:28px 20px 15px;border-bottom:1px solid rgba(255,255,255,0.06)}
.logo{width:68px;height:68px;margin:0 auto 10px;background:#7b5cff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 0 30px rgba(123,92,255,0.4)}
h1{font-size:22px;font-weight:700}
.sub{font-size:12px;color:#6b7280;margin-top:4px}
.body{padding:22px 20px}
.label{font-size:13px;font-weight:600;color:rgba(255,255,255,0.7);margin-bottom:6px;display:block}
.input{width:100%;padding:13px 16px;background:#12122a;border:1px solid rgba(255,255,255,0.06);border-radius:12px;color:#fff;font-size:15px;outline:none}
.input:focus{border-color:#7b5cff;box-shadow:0 0 0 3px rgba(123,92,255,0.15)}
.hint{font-size:11px;color:#6b7280;margin-top:6px}
.box{text-align:center;background:#12122a;border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:18px;margin-top:18px;display:none}
.code{font-size:30px;font-weight:800;letter-spacing:4px;color:#00e5ff;margin:10px 0;text-shadow:0 0 20px rgba(0,229,255,0.5)}
.btn{width:100%;padding:13px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px}
.btn-primary{background:#7b5cff;color:#fff;box-shadow:0 4px 15px rgba(123,92,255,0.3);margin-top:16px}
.btn-primary:disabled{opacity:0.5}
.btn-sec{background:#1e1e36;border:1px solid rgba(255,255,255,0.06);color:#fff}
.alert{padding:11px 13px;border-radius:12px;font-size:13px;margin-top:12px}
.success{background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);color:#10b981}
.error{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);color:#ef4444}
.spinner{width:16px;height:16px;border:2px solid rgba(123,92,255,0.2);border-top-color:#7b5cff;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
<div class="header">
<div class="logo">⚡</div>
<h1>BREAKER ULTRA-MD</h1>
<div class="sub">v2.7.0 BOX LOCKED - REAL PAIR</div>
</div>
<div class="body">
<label class="label">Phone Number (Must match WhatsApp)</label>
<input id="phone" class="input" placeholder="256790086834" value="256790086834">
<div class="hint">Enter EXACT number where you will type code. No + . Example: 256790086834</div>

<div id="box" class="box">
<div style="font-size:11px;color:#6b7280">YOUR REAL WHATSAPP CODE</div>
<div id="code" class="code">---- ----</div>
<div style="font-size:11px;color:#6b7280">WhatsApp > Linked Devices > Link with phone number > Enter within 60 seconds</div>
<div style="display:flex;gap:8px;margin-top:12px">
<button class="btn btn-sec" onclick="copyCode()" style="flex:1">Copy</button>
<button class="btn btn-sec" onclick="getCode()" style="flex:1">New Code</button>
</div>
</div>

<div id="alert"></div>
<button id="btn" class="btn btn-primary" onclick="getCode()">Generate Pairing Code</button>
<div class="hint" style="text-align:center;margin-top:14px">Code expires in 60 seconds - enter fast!</div>
</div>
</div>

<script>
let last='';
function show(msg,type){
document.getElementById('alert').innerHTML='<div class="alert '+type+'">'+msg+'</div>';
setTimeout(()=>document.getElementById('alert').innerHTML='',8000);
}
async function getCode(){
const num=document.getElementById('phone').value.replace(/[^0-9]/g,'');
if(!num) return show('Enter number','error');
last=num;
const btn=document.getElementById('btn');
btn.disabled=true;
btn.innerHTML='<span class="spinner"></span> Generating REAL code...';
try{
const r=await fetch('/code?number='+num);
const d=await r.json();
if(d.code){
document.getElementById('box').style.display='block';
document.getElementById('code').innerText=d.code;
show('REAL code for '+num+' - Enter NOW in WhatsApp > Linked Devices > Link with phone number','success');
}else{
show(d.error||'Failed','error');
}
}catch(e){
show('Error: '+e.message,'error');
}
btn.disabled=false;
btn.innerHTML='Generate Pairing Code';
}
function copyCode(){
const c=document.getElementById('code').innerText;
navigator.clipboard.writeText(c.replace(/-/g,''));
show('Copied: '+c,'success');
}
</script>
</body>
</html>
